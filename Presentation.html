<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Oral Presentation – Samuel Clarke</title>

  <!-- Fonts: Futuristic monospace + clean sans fallback -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />

  <style>
    /* GLOBAL: Matrix neon green aesthetic */
    :root {
      --bg: #050505;
      --grid: rgba(0, 255, 140, 0.08);
      --neon: #00ff8c;      /* primary neon green */
      --neon-soft: #72ffb5; /* softer neon for accents */
      --text: #c8ffdf;      /* readable green on black */
      --maroon: #7affc8;    /* repurposed accent to stay in palette */
      --card-bg: rgba(10, 20, 15, 0.85);
      --border: rgba(0, 255, 140, 0.35);
      --shadow: 0 0 12px rgba(0, 255, 140, 0.25), inset 0 0 8px rgba(0, 255, 140, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background:
        radial-gradient(1200px 600px at 70% 10%, rgba(0, 255, 140, 0.08), transparent 55%),
        radial-gradient(900px 500px at 10% 80%, rgba(0, 255, 140, 0.06), transparent 60%),
        linear-gradient(to bottom, #000 0%, #05140f 100%);
      color: var(--text);
      font-family: "Share Tech Mono", "Michroma", Orbitron, monospace;
      font-size: 16px;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Subtle matrix grid overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(transparent 31px, var(--grid) 32px, transparent 33px),
        linear-gradient(90deg, transparent 31px, var(--grid) 32px, transparent 33px);
      background-size: 32px 32px, 32px 32px;
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0.35;
    }

    /* Animated binary rain background (lightweight CSS) */
    .binary-rain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;
      filter: blur(0.4px);
      background-image:
        repeating-linear-gradient(
          to bottom,
          rgba(0, 255, 140, 0.0) 0,
          rgba(0, 255, 140, 0.22) 2px,
          rgba(0, 255, 140, 0.0) 4px
        );
      animation: drift 12s linear infinite;
    }

    @keyframes drift {
      0%   { transform: translateY(-8vh); }
      100% { transform: translateY(8vh); }
    }

    .container {
      width: 88%;
      max-width: 900px;
      margin: 60px auto;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 36px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px) saturate(115%);
    }

    h1, h2 {
      font-family: Orbitron, "Share Tech Mono", sans-serif;
      text-align: center;
      color: var(--neon);
      text-shadow: 0 0 10px rgba(0, 255, 140, 0.45);
      letter-spacing: 0.5px;
      margin: 0.2em 0 0.6em;
    }

    h1 {
      font-size: 2rem;
      border-bottom: 1px dashed rgba(0, 255, 140, 0.35);
      padding-bottom: 0.4em;
    }

    h2 {
      font-size: 1.35rem;
      color: var(--neon-soft);
      opacity: 0.95;
    }

    img {
      display: block;
      margin: 22px auto;
      max-width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 0 14px rgba(0, 255, 140, 0.25);
      filter: saturate(120%) contrast(105%);
    }

    p {
      line-height: 1.85;
      margin-bottom: 22px;
      font-size: 16px;
      color: var(--text);
      text-shadow: 0 0 6px rgba(0, 255, 140, 0.12);
    }

    nav {
      text-align: center;
      margin-top: 30px;
    }

    nav a {
      color: var(--neon);
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      font-family: Orbitron, "Share Tech Mono", sans-serif;
      padding: 12px 22px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(0, 255, 140, 0.06), rgba(0, 255, 140, 0.02));
      box-shadow: 0 0 10px rgba(0, 255, 140, 0.25), inset 0 0 6px rgba(0, 255, 140, 0.15);
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
      letter-spacing: 0.4px;
    }

    nav a:hover {
      transform: translateY(-1px);
      background: linear-gradient(180deg, rgba(0, 255, 140, 0.12), rgba(0, 255, 140, 0.06));
      box-shadow: 0 0 16px rgba(0, 255, 140, 0.4), inset 0 0 10px rgba(0, 255, 140, 0.25);
    }

    footer {
      text-align: center;
      margin-top: 44px;
      font-family: Orbitron, "Share Tech Mono", sans-serif;
      font-size: 14px;
      color: #9ff8ce;
      opacity: 0.85;
    }

    /* Image map highlights (binary glow on hover) */
    #image_map area {
      outline: none;
    }

    /* Optional: visual cue under image to hint interactivity */
    .map-hint {
      text-align: center;
      font-size: 13px;
      color: #84ffc9;
      opacity: 0.8;
      margin-top: -8px;
      margin-bottom: 16px;
      letter-spacing: 0.3px;
    }

    /* Decorative: animated header underline in binary */
    .binary-bar {
      display: block;
      width: 100%;
      height: 28px;
      margin: 8px 0 18px;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(0, 255, 140, 0.0) 0,
          rgba(0, 255, 140, 0.16) 1px,
          rgba(0, 255, 140, 0.0) 2px
        );
      mask-image: linear-gradient(to right, transparent 0, black 12%, black 88%, transparent 100%);
      animation: scan 3.8s linear infinite;
      border-radius: 6px;
    }

    @keyframes scan {
      0% { transform: translateX(-6%); }
      100% { transform: translateX(6%); }
    }
  </style>
</head>

<body>
  <!-- Ambient binary rain layer -->
  <div class="binary-rain" aria-hidden="true"></div>

  <div class="container">
    <h1>Oral Presentation On Visual Design:</h1>
    <span class="binary-bar" aria-hidden="true"></span>
  <br>
<center> 
  <h2>The Matrix (1999) Poster Analysis</h2>
  <video width="800" height="450" controls>
    <source src="Matrix (1999) Poster Oral Presentation.mp4" type="video/mp4">
  </video>
</center>
<br>

    <p>

    <nav>
      <a href="index.html">Homebase: Return to Logic Hub</a>
    </nav>

    <footer>
      <p>© Westward Equinox, 2025 — Samuel Clarke | CUNY Hunter | MEDPL 150 Visual Communication & Interactive Design</p>
    </footer>
  </div>
</body>
</html>
